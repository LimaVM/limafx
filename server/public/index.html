<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LimaFX</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>LimaFX</h1>

  <h2>Enviar imagem</h2>
  <form id="imgForm">
    <input type="file" name="file" accept="image/*" required />
    <button type="submit">Enviar</button>
  </form>
  <div id="imgResult"></div>

  <h2>Enviar vídeo</h2>
  <form id="vidForm">
    <input type="file" name="file" accept="video/*" required />
    <button type="submit">Enviar</button>
  </form>
  <div id="vidResult"></div>

<script>
async function sendForm(form, url, resultEl) {
  const data = new FormData(form);
  const res = await fetch(url, {
    method: 'POST',
    body: data
  });
  const json = await res.json();
  if (json.success) {
    resultEl.textContent = `Arquivo processado: ${json.file}`;
  } else {
    resultEl.textContent = `Erro: ${json.error}`;
  }
}

document.getElementById('imgForm').addEventListener('submit', e => {
  e.preventDefault();
  sendForm(e.target, '/api/image', document.getElementById('imgResult'));
});

document.getElementById('vidForm').addEventListener('submit', e => {
  e.preventDefault();
  sendForm(e.target, '/api/video', document.getElementById('vidResult'));
});
</script>
</body>
</html>
